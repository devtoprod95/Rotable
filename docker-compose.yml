services:
  nginx:
    image: nginx:alpine
    container_name: rotable-nginx
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/nginx-entrypoint.sh"]
    ports:
      - "${NGINX_PORT:-9999}:80"
    environment:
      - TZ=Asia/Seoul
    volumes:
      - ./docker/nginx-entrypoint.sh:/usr/local/bin/nginx-entrypoint.sh:ro
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
      - .:/var/www/html
    depends_on:
      php:
        condition: service_started
    networks:
      - rotable-network

  php:
    build: ./docker
    container_name: rotable-php
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    expose:
      - "${PHP_PORT:-9000}"
    ports:
      - "5173:5173"
    environment:
      - TZ=Asia/Seoul
    volumes:
      - ./docker/php.ini:/usr/local/etc/php/php.ini
      - ./docker/php-fpm.d/www.conf:/usr/local/etc/php-fpm.d/www.conf
      - .:/var/www/html
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - rotable-network

  redis:
    image: redis:alpine
    container_name: rotable-redis
    restart: unless-stopped
    ports:
      - "9998:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - rotable-network

  # Laravel Reverb (WebSocket) 서버. php 이미지를 재사용해 reverb:start 데몬만 실행한다.
  # 컨테이너 내부는 기본 포트 8080 사용, 호스트에는 9997 로 공개한다.
  # 기본 entrypoint(php-fpm 고정)를 덮어써서 reverb 를 직접 띄운다.
  reverb:
    build: ./docker
    container_name: rotable-reverb
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    entrypoint: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "${REVERB_HOST_PORT:-9997}:8080"
    environment:
      - TZ=Asia/Seoul
    volumes:
      - ./docker/php.ini:/usr/local/etc/php/php.ini
      - .:/var/www/html
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - rotable-network

volumes:
  redis_data:

networks:
  rotable-network:
    driver: bridge
